<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ingrecipes - Navbar Demo</title>
    <style>
        /* Basic styling for the navbar */
        .navbar {
            display: flex;
            background-color: #2c3e50;
            padding: 10px 20px;
            align-items: center;
            color: #ecf0f1;
            font-family: Arial, sans-serif;
        }
        .navbar a {
            color: #ecf0f1;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }
        .navbar a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- The navbar will be injected by navbar.js -->
    <script src="navbar.js"></script>
</body>
</html>
